
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">

<title>Spec Development | Social Links</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

:root {
    --bg: #080808;
    --card: #111111;
    --white: #ffffff;
    --gray: #999999;
    --border: #252525;
    --discord: #5865F2;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(ellipse at top, #222222 0%, transparent 55%),
        var(--bg);
    color: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 430px;
    text-align: center;
    animation: appear .8s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* MAIN LOGO */

.logo {
    width: 150px;
    height: 150px;
    margin: 0 auto 20px;
    border-radius: 18px;
    overflow: hidden;
    background: transparent;
    animation: logo-appear 1s ease;
}

.logo-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    border-radius: 18px;
    filter: drop-shadow(0 0 12px rgba(255,255,255,.12));
    transition: transform .3s ease;
}

.logo:hover .logo-image {
    transform: scale(1.04);
}

@keyframes logo-appear {
    from {
        opacity: 0;
        transform: scale(.9);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

h1 {
    font-size: 35px;
    font-weight: 900;
    letter-spacing: 5px;
}

.subtitle {
    margin-top: 12px;
    color: var(--gray);
    font-size: 13px;
    letter-spacing: 2px;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 20px;
    padding: 8px 13px;
    border: 1px solid var(--border);
    border-radius: 30px;
    color: #cccccc;
    font-size: 11px;
}

.dot {
    width: 7px;
    height: 7px;
    background: #ffffff;
    border-radius: 50%;
}

/* SOCIAL LINKS */

.links {
    display: grid;
    gap: 13px;
    margin-top: 32px;
}

.social {
    min-height: 62px;
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 15px;
    text-decoration: none;
    color: white;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition:
        transform .25s ease,
        background .25s ease,
        border-color .25s ease;
}

.social:hover {
    transform: translateY(-3px);
    background: #1a1a1a;
    border-color: #555555;
}

.social:active {
    transform: scale(.98);
}

/* ICONS */

.icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #202020;
    color: #ffffff;
}

.icon svg {
    width: 23px;
    height: 23px;
    display: block;
}

/* DISCORD */

.discord-icon {
    background: var(--discord);
}

.social:hover .discord-icon {
    background: #4752C4;
}

/* INSTAGRAM */

.instagram-icon {
    background: linear-gradient(
        45deg,
        #feda75 0%,
        #fa7e1e 25%,
        #d62976 50%,
        #962fbf 75%,
        #4f5bd5 100%
    );
}

.instagram-icon svg {
    width: 25px;
    height: 25px;
}

/* YOUTUBE */

.youtube-icon {
    background: #202020;
}

.social:hover .youtube-icon {
    background: #ff0033;
}

/* TIKTOK */

.tiktok-icon {
    background: #202020;
}

/* TEXT */

.info {
    flex: 1;
    text-align: left;
}

.info strong {
    display: block;
    font-size: 14px;
    margin-bottom: 5px;
}

.info span {
    display: block;
    color: var(--gray);
    font-size: 11px;
}

.arrow {
    color: #777777;
    font-size: 22px;
    transition: .2s;
}

.social:hover .arrow {
    color: #ffffff;
    transform: translateX(4px);
}

/* FOOTER */

.footer {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    color: #666666;
    font-size: 11px;
    letter-spacing: 1px;
}

.footer b {
    color: #ffffff;
}

/* MOBILE */

@media (max-width: 480px) {
    body {
        padding: 20px;
    }

    h1 {
        font-size: 29px;
        letter-spacing: 4px;
    }

    .container {
        max-width: 360px;
    }

    .logo {
        width: 125px;
        height: 125px;
    }
}

/* ACCESSIBILITY */

.social:focus-visible {
    outline: 2px solid white;
    outline-offset: 4px;
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>
